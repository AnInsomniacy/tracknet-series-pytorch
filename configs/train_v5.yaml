model:
  version: v5
  sequence_length: 3
  base_channels: 64
  rstr_patch_size: 16
  rstr_embed_dim: 64
  rstr_heads: 4
  rstr_layers: 1
  stochastic_context_dropout: 0.1

dataset:
  processed_root: data/processed/tracknet_dataset_512x288
  sequence_length: 3
  frame_stride: 1
  train_split_file: data/processed/tracknet_dataset_512x288/splits/train.txt
  val_split_file: data/processed/tracknet_dataset_512x288/splits/val.txt

train:
  experiment_name: tracknet_v5
  output_root: outputs/train
  epochs: 30
  batch_size: 2
  workers: 8
  persistent_workers: true
  prefetch_factor: 2
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.0
  scheduler: MultiStepLR
  milestones: [20, 25]
  gamma: 0.1
  loss: wbce
  device: auto
  amp: true
  tensorboard: true
  launch_tensorboard: true
  tensorboard_port: 6006
  tensorboard_images: true
  tensorboard_hparams: true
  tensorboard_histograms: false
  tensorboard_profiler: false
  log_every_steps: 20
  tensorboard_flush_secs: 30
  tensorboard_max_queue: 100
  seed: 26
