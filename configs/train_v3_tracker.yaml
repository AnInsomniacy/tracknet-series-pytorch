model:
  version: v3
  sequence_length: 8
  base_channels: 64
  dropout: 0.0

dataset:
  processed_root: data/processed/tracknet_dataset_512x288
  sequence_length: 8
  frame_stride: 1
  train_split_file: data/processed/tracknet_dataset_512x288/splits/train.txt
  val_split_file: data/processed/tracknet_dataset_512x288/splits/val.txt

train:
  experiment_name: tracknet_v3_tracker
  output_root: outputs/train
  epochs: 30
  batch_size: 10
  workers: 8
  persistent_workers: true
  prefetch_factor: 2
  optimizer: Adam
  lr: 0.001
  loss: wbce
  device: auto
  amp: true
  tensorboard: true
  seed: 26
