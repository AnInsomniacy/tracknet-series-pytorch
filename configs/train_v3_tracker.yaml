model:
  version: v3
  sequence_length: 8
  base_channels: 64
  dropout: 0.0

dataset:
  processed_root: data/processed/tracknet_512x288
  sequence_length: 8
  model_version: v3
  target_frame_mode: all
  heatmap_mode: binary_disk
  # Radius should be set to the empirical shuttle/ball radius for the dataset.
  radius: 3.0
  include_background: true
  frame_stride: 1

train:
  experiment_name: tracknet_v3_tracker
  output_root: outputs/train
  epochs: 30
  batch_size: 10
  workers: 8
  val_split: 0.2
  optimizer: Adam
  lr: 0.001
  loss: wbce
  device: auto
  amp: true
  seed: 26
