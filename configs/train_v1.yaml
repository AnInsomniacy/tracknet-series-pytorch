model:
  version: v1
  sequence_length: 3
  base_channels: 64
  dropout: 0.0

dataset:
  processed_root: data/processed/tracknet_640x360
  sequence_length: 3
  frame_stride: 1

train:
  experiment_name: tracknet_v1
  output_root: outputs/train
  epochs: 500
  batch_size: 2
  workers: 4
  val_split: 0.2
  optimizer: Adadelta
  lr: 1.0
  loss: cross_entropy
  device: auto
  amp: true
  seed: 26
