model:
  version: v2
  sequence_length: 3
  base_channels: 64
  dropout: 0.0

dataset:
  processed_root: dataset/processed/tracknet_dataset_512x288
  sequence_length: 3
  frame_stride: 1
  train_split_file: dataset/processed/tracknet_dataset_512x288/splits/train.txt
  val_split_file: dataset/processed/tracknet_dataset_512x288/splits/val.txt

train:
  experiment_name: tracknet_v2_ddp_max
  output_root: outputs/train
  epochs: 50
  batch_size: 1
  workers: 4
  persistent_workers: true
  prefetch_factor: 4
  optimizer: Adadelta
  lr: 1.0
  loss: wbce
  device: auto
  amp: true
  tensorboard: true
  launch_tensorboard: true
  tensorboard_port: 6006
  tensorboard_images: true
  tensorboard_hparams: true
  tensorboard_histograms: true
  tensorboard_profiler: true
  tensorboard_profile_plugin: true
  tensorboard_model_graph: false
  log_every_steps: 10
  tensorboard_flush_secs: 10
  tensorboard_max_queue: 100
  seed: 26
