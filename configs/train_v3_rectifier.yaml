model:
  version: v3_rectifier
  hidden_channels: 64

dataset:
  type: trajectory
  processed_root: data/processed/tracknet_dataset_512x288
  trajectory_length: 16
  frame_stride: 1
  mask_ratio: 0.3
  delta_y_pixels: 30.0
  train_split_file: data/processed/tracknet_dataset_512x288/splits/train.txt
  val_split_file: data/processed/tracknet_dataset_512x288/splits/val.txt
  seed: 26

train:
  experiment_name: tracknet_v3_rectifier
  output_root: outputs/train
  epochs: 30
  batch_size: 32
  workers: 4
  persistent_workers: true
  prefetch_factor: 2
  optimizer: Adam
  lr: 0.001
  loss: trajectory_mse
  device: auto
  amp: true
  tensorboard: true
  seed: 26
